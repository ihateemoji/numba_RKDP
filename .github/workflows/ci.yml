# CI workflow for the numba_RKDP project.
# Runs on every push and pull_request to master/main.
# The workflow tests that the package installs via pip and that
# the test suite passes on Linux, macOS and Windows.
#
# On Windows we install mingw-w64 so that the same gcc-based
# Makefile can be used (see the project Makefile).

name: Python package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # ------------------------------------------------------------
  # Linux job (Ubuntu)
  # ------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -s

  # ------------------------------------------------------------
  # macOS job
  # ------------------------------------------------------------
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install real GCC (not Apple clang)
        run: |
          brew install gcc
          # Force the build to use Homebrew's gcc instead of Apple clang
          GCC_BIN=$(ls $(brew --prefix gcc)/bin/gcc-* | head -n1)
          echo "CC=$GCC_BIN" >> $GITHUB_ENV

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -s

  # ------------------------------------------------------------
  # Windows job
  # We need a C compiler. The project Makefile uses gcc, so we
  # install mingw-w64 via Chocolatey so that gcc is available.
  # After that the normal "pip install ." should work.
  # ------------------------------------------------------------
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mingw-w64 (provides gcc)
        # Chocolatey is pre-installed on GitHub Windows runners
        run: choco install mingw -y

      - name: Add mingw to PATH
        # The Chocolatey package puts gcc in this location
        run: echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -s
