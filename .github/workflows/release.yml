# GitHub Actions workflow that builds platform wheels using cibuildwheel
# and publishes them as a GitHub Release.
#
# Triggers on version tags (v*) or manual dispatch.

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        # cibuildwheel will automatically:
        # - create isolated build environments
        # - run `pip wheel .` inside them
        # - produce manylinux/macosx/win wheels containing the compiled library
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          # We only need the shared library; no tests during wheel build
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with wheels
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.whl